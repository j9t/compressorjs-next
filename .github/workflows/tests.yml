name: "Tests"

on:
  push:
    branches: main
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        node: ["lts/*", "current"]
        include:
          # Windows: One LTS job is enough
          - platform: windows-latest
            node: "lts/*"
    name: "Node ${{ matrix.node }} (${{ matrix.platform }})"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Lint"
        # Lint results don’t vary by platform or Node version
        if: matrix.platform == 'ubuntu-latest' && matrix.node == 'lts/*'
        run: npm run lint
      - name: "Run tests"
        # Types, browser suite, package entry points, and publishing correctness
        run: npm test
      - name: "Coverage"
        # Thresholds are enforced here; the numbers don’t vary by platform
        if: matrix.platform == 'ubuntu-latest' && matrix.node == 'lts/*'
        run: npm run test:coverage

  # Node versions are covered above and don’t affect the browsers
  test-macos:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: "Node lts/* (macOS, all browsers)"
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Set up Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Run tests (full browser matrix)"
        run: npm run test:browser:all
