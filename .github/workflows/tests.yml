name: "Tests"

on:
  push:
    branches: main
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]
        node: ["lts/*", "current"]
    name: "Node ${{ matrix.node }} (${{ matrix.platform }})"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Lint"
        # Lint results don’t vary by platform or Node version
        if: matrix.platform == 'ubuntu-latest' && matrix.node == 'lts/*'
        run: npm run lint
      - name: "Test"
        # Types, browser suite, package entry points, and publishing correctness
        run: npm test
      - name: "Coverage"
        # Thresholds are enforced here; the numbers don’t vary by platform
        if: matrix.platform == 'ubuntu-latest' && matrix.node == 'lts/*'
        run: npm run test:coverage

  test-macos:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        node: ["lts/*", "current"]
    name: "Node ${{ matrix.node }} (macOS, all browsers)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: "Install dependencies"
        run: npm ci
      - name: "Test (full browser matrix)"
        run: npm run test:browser:all
